<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="130" viewBox="0 0 440 130" role="img" aria-label="Private-VPN — project">
<title>Private-VPN — project</title>
<defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#ff2bd6"/>
    <stop offset="0.5" stop-color="#b026ff"/>
    <stop offset="1" stop-color="#00f0ff"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="neonStatic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff2bd6"/>
    <stop offset="0.5" stop-color="#b026ff"/>
    <stop offset="1" stop-color="#00f0ff"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="1" y="1" width="438" height="128" rx="12" fill="#0b0418" stroke="#2a1650" stroke-width="2"/>
<rect x="1" y="1" width="4" height="128" rx="2" fill="#ff2bd6" filter="url(#glow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></rect>

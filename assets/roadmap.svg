<text x="450" y="120" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e8dcff">SECURITY</text>
<text x="450" y="142" text-anchor="middle" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="12" fill="#c77dff">ACL · NAT</text>
<rect x="427.0" y="156" width="46" height="22" rx="11" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff"/><text x="450" y="171" text-anchor="middle" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#00f0ff">LAB</text>
<circle cx="630" cy="70" r="14" fill="none" stroke="#ff2bd6" stroke-width="2"><animate attributeName="r" values="14;34" dur="2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="630" cy="70" r="14" fill="none" stroke="#ff2bd6" stroke-width="2"><animate attributeName="r" values="14;34" dur="2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="630" cy="70" r="14" fill="#140a2e" stroke="#ff2bd6" stroke-width="3" filter="url(#glow)"/><circle cx="630" cy="70" r="5" fill="#ff2bd6"/>
<text x="630" y="120" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e8dcff">FORTIGATE</text>
<text x="630" y="142" text-anchor="middle" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="12" fill="#c77dff">Policy · VPN · SD-WAN</text>
<rect x="607.0" y="156" width="46" height="22" rx="11" fill="#ff2bd6" fill-opacity="0.15" stroke="#ff2bd6"/><text x="630" y="171" text-anchor="middle" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#ff2bd6">NOW</text>

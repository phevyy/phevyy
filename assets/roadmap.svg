<text x="270" y="120" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e8dcff">ROUTING</text>
<text x="270" y="142" text-anchor="middle" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="12" fill="#c77dff">OSPF · Inter-VLAN</text>

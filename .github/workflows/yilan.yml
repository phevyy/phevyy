name: generate profile assets

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # neon stats / languages / streak cards + Firewall Defense game (scripts/build_stats.py, stdlib only)
      - name: build stats cards
        run: python3 scripts/build_stats.py phevyy dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # push everything in dist/ to the output branch
      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

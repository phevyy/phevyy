name: generate profile assets

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # neon stats / languages / streak cards (scripts/build_stats.py, stdlib only)
      - name: build stats cards
        run: python3 scripts/build_stats.py phevyy dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # neon purple / pink / cyan snake, matching the profile palette
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: phevyy
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff2bd6&color_dots=#ebedf0,#e0c3fc,#c77dff,#9d4edd,#7b2cbf
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#161b22,#3c1361,#7b2cbf,#b026ff,#ff2bd6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # push everything in dist/ to the output branch
      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
